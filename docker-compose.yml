services:
  # --- Frontend React ---
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
      - patient-service
      - appointment-service
      - billing-service
      - ehr-service
      - lab-service
      - pharmacy-service
    networks:
      - myheart-network

  # --- Service Discovery ---
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0"
    volumes:
      - ./consul/config:/consul/config
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API Gateway ---
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - consul
      - patient-service
      - appointment-service
      - billing-service
      - pharmacy-service
      - ehr-service
      - lab-service
    networks:
      - myheart-network

  # --- Bases de données PostgreSQL ---
  patient-db:
    image: postgres:15
    container_name: patient-db
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - patient-data:/var/lib/postgresql/data
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d patientdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  appointment-db:
    image: postgres:15
    container_name: appointment-db
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - appointment-data:/var/lib/postgresql/data
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appointmentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:15
    container_name: billing-db
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - billing-data:/var/lib/postgresql/data
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d billingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pharmacy-db:
    image: postgres:15
    container_name: pharmacy-db
    environment:
      POSTGRES_DB: pharmacydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - pharmacy-data:/var/lib/postgresql/data
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pharmacydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Bases de données MongoDB ---
  ehr-db:
    image: mongo:6
    container_name: ehr-db
    ports:
      - "27017:27017"
    volumes:
      - ehr-data:/data/db
    networks:
      - myheart-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  lab-db:
    image: mongo:6
    container_name: lab-db
    ports:
      - "27018:27017"
    volumes:
      - lab-data:/data/db
    networks:
      - myheart-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redpanda (Kafka-compatible) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.1.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - myheart-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Microservices Spring Boot ---
  patient-service:
    build: ./backend/patient-service
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patientdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      patient-db:
        condition: service_healthy
    networks:
      - myheart-network

  appointment-service:
    build: ./backend/appointment-service
    container_name: appointment-service
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-db:5432/appointmentdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      appointment-db:
        condition: service_healthy
    networks:
      - myheart-network

  billing-service:
    build: ./backend/billing-service
    container_name: billing-service
    ports:
      - "8083:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/billingdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      billing-db:
        condition: service_healthy
    networks:
      - myheart-network

  pharmacy-service:
    build: ./backend/pharmacy-service
    container_name: pharmacy-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pharmacy-db:5432/pharmacydb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      pharmacy-db:
        condition: service_healthy
    networks:
      - myheart-network

  # --- Microservices Node.js avec Redpanda ---
  ehr-service:
    build: ./backend/ehr-service
    container_name: ehr-service
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://ehr-db:27017/ehrdb
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: ehr-service
      KAFKA_GROUP_ID: ehr-group
      PORT: 8084
    depends_on:
      ehr-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - myheart-network

  lab-service:
    build: ./backend/lab-service
    container_name: lab-service
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: mongodb://lab-db:27017/labdb
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: lab-service
      KAFKA_GROUP_ID: lab-group
      PORT: 8085
    depends_on:
      lab-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - myheart-network

networks:
  myheart-network:
    driver: bridge

volumes:
  patient-data:
  appointment-data:
  billing-data:
  pharmacy-data:
  ehr-data:
  lab-data: